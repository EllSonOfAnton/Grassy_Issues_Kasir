<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grassy Issues Kasir 🍵</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --matcha-dark: #2d5a27;
            --matcha-accent: #66bb6a;
        }
        body { background-color: #f4f8f4; font-family: 'Segoe UI', sans-serif; }
        
        .product-card {
            border: none; border-radius: 12px; cursor: pointer;
            background: white; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(45, 90, 39, 0.15); }
        .product-header { 
            background: linear-gradient(135deg, var(--matcha-dark), var(--matcha-accent)); 
            padding: 20px; text-align: center; font-size: 2.5rem; color: white;
        }
        .cart-panel {
            background: white; height: 100vh; display: flex; flex-direction: column; 
            border-left: 1px solid #ddd; position: fixed; right: 0; top: 0; width: 35%;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05); z-index: 1000;
        }
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; }
        .addon-section-title {
            font-size: 0.9rem; font-weight: bold; text-transform: uppercase; 
            color: var(--matcha-dark); border-bottom: 2px solid #a5d6a7; margin-bottom: 10px;
        }
        .btn-matcha { background-color: var(--matcha-dark); color: white; border: none; }
        .btn-matcha:hover { background-color: #1b3a18; color: white; }
        
        @media (max-width: 992px) {
            .cart-panel { position: relative; width: 100%; height: auto; border-left: none; }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 p-4">
            <h3 class="fw-bold mb-4" style="color: var(--matcha-dark);">GRASSY ISSUES KASIR</h3>
            <div class="row" id="productList"></div>
        </div>

        <div class="col-lg-4 p-0">
            <div class="cart-panel">
                <div class="p-3 bg-white border-bottom shadow-sm">
                    <h5 class="fw-bold m-0 text-dark">🛒 Current Order</h5>
                </div>
                <div class="scroll-area">
                    <table class="table table-borderless align-middle">
                        <tbody id="cartTable">
                            <tr><td class="text-center text-muted py-5">Keranjang Kosong</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-4 bg-light border-top">
                    <div class="d-flex justify-content-between mb-3 align-items-center">
                        <span class="h6 m-0 text-muted">Total Tagihan</span>
                        <span class="h4 m-0 fw-bold" style="color: var(--matcha-dark);" id="grandTotal">Rp 0</span>
                    </div>
                    <button onclick="processOrderAPI()" id="btnKirim" class="btn btn-matcha w-100 py-3 fw-bold rounded-3 shadow-sm">
                        KIRIM ORDER 🚀
                    </button>
                    <button onclick="clearCart()" class="btn btn-outline-secondary w-100 mt-2 btn-sm border-0">
                        Batalkan Transaksi
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addonModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header text-white" style="background-color: var(--matcha-dark);">
                <h5 class="modal-title fw-bold" id="modalTitle">Customize Drink</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <input type="hidden" id="selectedProductId">
                
                <div class="bg-white p-3 rounded mb-3 shadow-sm">
                    <div class="addon-section-title">Extra Shot</div>
                    <div id="dynamicExtraShot"></div>
                </div>

                <div class="bg-white p-3 rounded mb-3 shadow-sm">
                    <div class="addon-section-title">Toppings</div>
                    <div id="toppingList" class="row g-2"></div>
                </div>
            </div>
            <div class="modal-footer bg-white">
                <div class="d-flex justify-content-between w-100 align-items-center">
                    <div>
                        <small class="text-muted d-block">Estimasi Harga</small>
                        <div class="fw-bold fs-5 text-success" id="modalTotalPrice">Rp 0</div>
                    </div>
                    <button type="button" class="btn btn-matcha px-4 rounded-pill" onclick="confirmAddToCart()">
                        + Masukkan Keranjang
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // KONFIGURASI
    const TARGET_NUMBER = "085183646806"; 
    const API_TOKEN = "5zuv52cp5t5UtKByHCXs";

    const drinks = [
        { id: 1, name: "Matcha Latte Kusa", price: 12000, shotPrice: 1000 },
        { id: 2, name: "Matcha Latte Mori1", price: 13000, shotPrice: 1000 },
        { id: 3, name: "Matcha Latte Yuki", price: 15000, shotPrice: 1500 },
        { id: 4, name: "Matcha Latte Hana", price: 16000, shotPrice: 2000 },
        { id: 5, name: "Matcha Latte Waguri", price: 17000, shotPrice: 2500 },
        { id: 6, name: "Matcha Latte Kana", price: 32000, shotPrice: 6000 },
    ];

    const toppings = [
        { name: "Cheese Cream", price: 3000 },
        { name: "Strawberry Jam", price: 3000 },
        { name: "Palm Sugar", price: 2000 },
        { name: "Oreo", price: 3000 },
        { name: "Regal", price: 3000 },
        { name: "Full Oat", price: 2000 },
        { name: "Honey", price: 4000 },
    ];

    let cart = [];
    let modalInstance;
    let currentShotPrice = 0; // Menyimpan harga shot produk yg sedang dipilih

    // 1. RENDER MENU
    const productList = document.getElementById('productList');
    drinks.forEach(d => {
        productList.innerHTML += `
            <div class="col-6 col-lg-4 mb-4">
                <div class="product-card h-100 pb-2" onclick="openModal(${d.id})">
                    <div class="product-header">🍵</div>
                    <div class="px-3 pt-3 text-center">
                        <h6 class="fw-bold mb-1 text-dark">${d.name}</h6>
                        <span class="badge bg-light text-success border border-success">
                            ${(d.price/1000)}K
                        </span>
                    </div>
                </div>
            </div>
        `;
    });

    // 2. LOGIC MODAL
    function openModal(id) {
        const drink = drinks.find(d => d.id === id);
        document.getElementById('modalTitle').innerText = drink.name;
        document.getElementById('selectedProductId').value = drink.id;
        
        currentShotPrice = drink.shotPrice;

        // A. Render Counter Extra Shot (Bisa tambah banyak)
        const shotHtml = `
            <div class="d-flex align-items-center justify-content-between bg-light p-2 rounded border">
                <div>
                    <span class="fw-bold text-dark d-block">Shot ${drink.name.replace('Matcha Latte ', '')}</span>
                    <small class="text-success">+${drink.shotPrice/1000}k / shot</small>
                </div>
                <div class="input-group input-group-sm" style="width: 120px;">
                    <button class="btn btn-outline-secondary fw-bold" onclick="updateShotCount(-1)">-</button>
                    <input type="text" class="form-control text-center bg-white fw-bold" id="modalShotQty" value="0" readonly>
                    <button class="btn btn-matcha" onclick="updateShotCount(1)">+</button>
                </div>
            </div>
        `;
        document.getElementById('dynamicExtraShot').innerHTML = shotHtml;

        // B. Render Topping Checkbox
        document.getElementById('toppingList').innerHTML = toppings.map((t, index) => `
            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input addon-check" type="checkbox" 
                        value="top_${index}" 
                        data-name="${t.name}" 
                        data-price="${t.price}" 
                        id="top_${index}" 
                        onchange="calculateModalTotal()">
                    <label class="form-check-label small" for="top_${index}">${t.name} (+${t.price/1000}k)</label>
                </div>
            </div>
        `).join('');

        calculateModalTotal();
        modalInstance = new bootstrap.Modal(document.getElementById('addonModal'));
        modalInstance.show();
    }

    // Fungsi Tambah/Kurang Shot
    function updateShotCount(change) {
        const input = document.getElementById('modalShotQty');
        let val = parseInt(input.value);
        val += change;
        if (val < 0) val = 0; // Tidak boleh minus
        input.value = val;
        calculateModalTotal();
    }

    function calculateModalTotal() {
        const drinkId = parseInt(document.getElementById('selectedProductId').value);
        const drink = drinks.find(d => d.id === drinkId);
        
        // Harga Dasar
        let total = drink.price;
        
        // Tambah Harga Shot
        const shotQty = parseInt(document.getElementById('modalShotQty').value) || 0;
        total += (shotQty * currentShotPrice);

        // Tambah Harga Topping
        document.querySelectorAll('.addon-check:checked').forEach(cb => {
            total += parseInt(cb.getAttribute('data-price'));
        });

        document.getElementById('modalTotalPrice').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function confirmAddToCart() {
        const drinkId = parseInt(document.getElementById('selectedProductId').value);
        const drink = drinks.find(d => d.id === drinkId);
        let selectedAddons = [];
        let addonPriceTotal = 0;

        // 1. Masukkan Extra Shot ke list addon jika ada
        const shotQty = parseInt(document.getElementById('modalShotQty').value) || 0;
        if (shotQty > 0) {
            const totalShotPrice = shotQty * currentShotPrice;
            const shotName = `${shotQty}x Extra Shot ${drink.name.replace('Matcha Latte ', '')}`;
            selectedAddons.push({ name: shotName, price: totalShotPrice });
            addonPriceTotal += totalShotPrice;
        }

        // 2. Masukkan Topping
        document.querySelectorAll('.addon-check:checked').forEach(cb => {
            const name = cb.getAttribute('data-name');
            const price = parseInt(cb.getAttribute('data-price'));
            selectedAddons.push({ name: name, price: price });
            addonPriceTotal += price;
        });

        cart.push({
            uid: Date.now(),
            drink: drink,
            addons: selectedAddons,
            totalPrice: drink.price + addonPriceTotal
        });

        renderCart();
        modalInstance.hide();
    }

    // 3. LOGIC KERANJANG & API
    function renderCart() {
        const tbody = document.getElementById('cartTable');
        const grandTotalEl = document.getElementById('grandTotal');
        
        if(cart.length === 0) {
            tbody.innerHTML = '<tr><td class="text-center text-muted py-5">Keranjang Kosong</td></tr>';
            grandTotalEl.innerText = 'Rp 0';
            return;
        }

        tbody.innerHTML = '';
        let grandTotal = 0;

        cart.forEach((item, index) => {
            grandTotal += item.totalPrice;
            let addonHtml = '';
            if(item.addons.length > 0) {
                addonHtml = '<div class="text-muted small fst-italic mt-1 ps-2 border-start border-3 border-success">';
                item.addons.forEach(a => { 
                    addonHtml += `+ ${a.name} <span class="text-success">(${a.price/1000}k)</span><br>`; 
                });
                addonHtml += '</div>';
            }

            tbody.innerHTML += `
                <tr class="border-bottom">
                    <td>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-dark">${item.drink.name}</span>
                            <span class="fw-bold text-success">${item.totalPrice.toLocaleString('id-ID')}</span>
                        </div>
                        ${addonHtml}
                        <div class="text-end mt-2">
                            <button onclick="removeItem(${index})" class="btn btn-link text-danger p-0 text-decoration-none small">Hapus Item</button>
                        </div>
                    </td>
                </tr>
            `;
        });
        grandTotalEl.innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
    }

    function removeItem(index) { cart.splice(index, 1); renderCart(); }
    function clearCart() { cart = []; renderCart(); }

    function processOrderAPI() {
        if (cart.length === 0) return Swal.fire('Oops', 'Keranjang masih kosong!', 'warning');
        
        const btn = document.getElementById('btnKirim');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Sedang Mengirim... ⏳';
        btn.disabled = true;

        let message = `*ORDER MATCHA MASUK* 🍵\n`;
        message += `📅 ${new Date().toLocaleString('id-ID')}\n`;
        message += `------------------------\n`;
        
        let total = 0;
        cart.forEach((item, i) => {
            total += item.totalPrice;
            message += `${i+1}. *${item.drink.name}* \n`;
            if(item.addons.length > 0) {
                item.addons.forEach(a => {
                    message += `   + ${a.name} (${a.price/1000}k)\n`;
                });
            }
            message += `   Subtotal: Rp ${item.totalPrice.toLocaleString('id-ID')}\n\n`;
        });
        
        message += `------------------------\n`;
        message += `*TOTAL: Rp ${total.toLocaleString('id-ID')}*`;

        const formData = new FormData();
        formData.append('target', TARGET_NUMBER);
        formData.append('message', message);

        fetch("https://api.fonnte.com/send", {
            method: "POST",
            headers: { "Authorization": API_TOKEN },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if(data.status) {
                Swal.fire({
                    title: 'Berhasil!',
                    text: 'Orderan masuk ke WhatsApp!',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                });
                clearCart();
            } else {
                Swal.fire('Gagal', 'Cek Token / Kuota', 'error');
            }
        })
        .catch(error => {
            Swal.fire('Error', 'Jaringan bermasalah', 'error');
        })
        .finally(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
